<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="660" viewBox="0 0 1480 660" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <pattern id="loopStripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="14" height="14" fill="#a371f7" fill-opacity="0.07"/>
      <rect width="5" height="14" fill="#a371f7" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1480" height="660" fill="#141414"/>

  <!-- main rail: sequence (neutral) -->
  <path d="M 76 300 L 1380 300" stroke="#8b949e" stroke-opacity="0.13" stroke-width="96" stroke-linecap="round" fill="none"/>
  <text x="44" y="240" fill="#8b949e" font-size="11" font-weight="600">rail · runs in order</text>

  <!-- loop rail: iterative (indigo, striped, dashed edge) -->
  <rect x="300" y="112" width="884" height="376" rx="64" fill="url(#loopStripes)" stroke="#a371f7" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="380" y="138" fill="#c297ff" font-size="12" font-weight="700">↻ for each order</text>
  <text x="380" y="155" fill="#a371f7" font-size="11">repeats once per item</text>

  <!-- conditional tubes: then (green) / else (red), each to its own end, then rejoining the rail -->
  <path d="M 560 290 C 600 290 600 200 650 200 L 860 200" stroke="#3fb950" stroke-opacity="0.2" stroke-width="88" stroke-linecap="round" fill="none"/>
  <path d="M 560 312 C 600 312 600 410 650 410 L 860 410" stroke="#f85149" stroke-opacity="0.17" stroke-width="88" stroke-linecap="round" fill="none"/>
  <path d="M 900 200 C 935 200 935 300 958 300" stroke="#8b949e" stroke-opacity="0.13" stroke-width="40" fill="none"/>
  <path d="M 900 410 C 935 410 935 300 958 300" stroke="#8b949e" stroke-opacity="0.13" stroke-width="40" fill="none"/>
  <text x="640" y="150" fill="#56d364" font-size="12" font-weight="700">then</text>
  <text x="640" y="470" fill="#ff7b72" font-size="12" font-weight="700">else</text>

  <!-- branches: data only -->
  <g fill="none" stroke="#22d3ee" stroke-width="2">
    <path d="M 172 300 C 196 300 196 302 222 302"/>
    <path d="M 372 318 C 396 318 396 302 422 302"/>
    <path d="M 562 288 C 592 288 592 204 622 204"/>
    <path d="M 562 318 C 592 318 592 416 622 416"/>
    <path d="M 772 214 C 900 214 900 298 962 298"/>
    <path d="M 772 426 C 900 426 900 304 962 304"/>
    <path d="M 1102 310 C 1180 310 1180 302 1252 302"/>
  </g>

  <g font-size="12" fill="#e6edf3">
    <rect x="30" y="268" width="142" height="62" rx="8" fill="#172033" stroke="#334155"/>
    <text x="42" y="288" font-weight="600">Inputs</text>
    <text x="160" y="318" font-size="10" text-anchor="end" fill="#94a3b8">orders: Order[]</text>
    <circle cx="172" cy="300" r="5" fill="#facc15"/>

    <rect x="222" y="262" width="150" height="76" rx="8" fill="#1c1830" stroke="#a371f7" stroke-width="1.5"/>
    <text x="234" y="282" font-weight="600">↻ For each order</text>
    <circle cx="222" cy="302" r="5" fill="#22d3ee"/><text x="232" y="306" font-size="10" fill="#94a3b8">orders: Order[]</text>
    <circle cx="372" cy="318" r="5" fill="#facc15"/><text x="362" y="322" font-size="10" text-anchor="end" fill="#94a3b8">item: Order</text>

    <rect x="422" y="262" width="140" height="76" rx="8" fill="#172033" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="434" y="282" font-weight="600">⑂ Express?</text>
    <circle cx="422" cy="302" r="5" fill="#22d3ee"/><text x="432" y="306" font-size="10" fill="#94a3b8">order: Order</text>
    <circle cx="562" cy="288" r="5" fill="#3fb950"/><text x="552" y="292" font-size="10" text-anchor="end" fill="#56d364">then: Order</text>
    <circle cx="562" cy="318" r="5" fill="#f85149"/><text x="552" y="322" font-size="10" text-anchor="end" fill="#ff7b72">else: Order</text>

    <rect x="622" y="170" width="150" height="62" rx="8" fill="#172033" stroke="#334155"/>
    <text x="634" y="190" font-weight="600">Pick fast</text>
    <circle cx="622" cy="204" r="5" fill="#22d3ee"/><text x="632" y="208" font-size="10" fill="#94a3b8">order</text>
    <circle cx="772" cy="214" r="5" fill="#facc15"/><text x="762" y="218" font-size="10" text-anchor="end" fill="#94a3b8">pick: Pick</text>

    <rect x="622" y="382" width="150" height="62" rx="8" fill="#172033" stroke="#334155"/>
    <text x="634" y="402" font-weight="600">Pick standard</text>
    <circle cx="622" cy="416" r="5" fill="#22d3ee"/><text x="632" y="420" font-size="10" fill="#94a3b8">order</text>
    <circle cx="772" cy="426" r="5" fill="#facc15"/><text x="762" y="430" font-size="10" text-anchor="end" fill="#94a3b8">pick: Pick</text>

    <rect x="828" y="184" width="74" height="32" rx="16" fill="#12261a" stroke="#3fb950" stroke-width="1.5"/>
    <text x="865" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="#56d364">end then</text>
    <rect x="828" y="394" width="74" height="32" rx="16" fill="#2a1414" stroke="#f85149" stroke-width="1.5"/>
    <text x="865" y="414" text-anchor="middle" font-size="11" font-weight="600" fill="#ff7b72">end else</text>

    <rect x="962" y="268" width="140" height="62" rx="8" fill="#172033" stroke="#334155"/>
    <text x="974" y="288" font-weight="600">Ship</text>
    <circle cx="962" cy="301" r="5" fill="#22d3ee"/><text x="972" y="314" font-size="10" fill="#94a3b8">pick (2 branches)</text>
    <circle cx="1102" cy="310" r="5" fill="#facc15"/><text x="1092" y="300" font-size="10" text-anchor="end" fill="#94a3b8">label: Label</text>

    <rect x="1140" y="284" width="76" height="32" rx="16" fill="#1c1830" stroke="#a371f7" stroke-width="1.5"/>
    <text x="1178" y="304" text-anchor="middle" font-size="11" font-weight="600" fill="#c297ff">end loop</text>

    <rect x="1252" y="270" width="160" height="62" rx="8" fill="#172033" stroke="#334155"/>
    <text x="1264" y="290" font-weight="600">Notify</text>
    <circle cx="1252" cy="302" r="5" fill="#22d3ee"/><text x="1262" y="318" font-size="10" fill="#94a3b8">labels: Label[]</text>
  </g>

  <g font-size="12" fill="#c9d1d9">
    <rect x="30" y="560" width="26" height="12" rx="6" fill="#8b949e" fill-opacity="0.3"/><text x="64" y="571">rail: the flow, in order (a node on it runs; off it, it's detached)</text>
    <rect x="560" y="558" width="26" height="16" rx="5" fill="url(#loopStripes)" stroke="#a371f7" stroke-dasharray="4 3"/><text x="594" y="571">loop: repeats (indigo, striped, dashed edge, ↻)</text>
    <rect x="930" y="560" width="26" height="12" rx="6" fill="#3fb950" fill-opacity="0.35"/><rect x="960" y="560" width="26" height="12" rx="6" fill="#f85149" fill-opacity="0.35"/><text x="994" y="571">if: one of two (then / else)</text>
    <line x1="30" y1="602" x2="56" y2="602" stroke="#22d3ee" stroke-width="2"/><text x="64" y="607">branch: one value, port to port (the only kind of line)</text>
    <text x="560" y="607" fill="#8b949e">Each side ends at its own end; drag an end to grow or shrink that side.</text>
  </g>
</svg>
