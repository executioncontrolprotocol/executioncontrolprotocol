# Changesets status on PRs into development and the reset milestone.

name: changesets

on:
  pull_request:
    branches: [development, "milestone/**"]

permissions:
  contents: read

jobs:
  status:
    name: changeset-status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch base branch for Changesets
        run: git fetch origin development --depth=1 || true
      - name: Changesets status
        run: pnpm exec changeset status
