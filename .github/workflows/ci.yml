# Runs the full CI pipeline (build, lint, validate, unit/integration/browser/demo tests) on pushes and PRs.
# npm publish is opt-in on `main` only (see `ci-pipeline.yml` + `ENABLE_NPM_PUBLISH`).

name: ci

on:
  push:
    branches: [main, development, "feat/**"]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/ci-pipeline.yml
    secrets: inherit
