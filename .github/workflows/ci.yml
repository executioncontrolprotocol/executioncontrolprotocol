# Full CI pipeline: secrets, build, lint, unit/coverage, integration, e2e (Ubuntu +
# Windows), App Playwright (Ubuntu + Windows), bench. npm publish is opt-in on `main`
# only (see `ci-pipeline.yml` + `ENABLE_NPM_PUBLISH`).
#
# Runs on pushes to main / development / feat/** / milestone/**, and on PRs targeting
# those same branch families (so milestone/realignment gets the same checks as feat/).

name: ci

on:
  push:
    branches: [main, development, "feat/**", "milestone/**"]
  pull_request:
    branches: [main, development, "feat/**", "milestone/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/ci-pipeline.yml
    secrets: inherit
